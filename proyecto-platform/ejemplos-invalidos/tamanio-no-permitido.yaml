# Para la demo: igual a score.yaml pero con un tamaño de base que la
# plataforma no ofrece (no está en el catálogo de golden paths).
# bash plataforma/validar.sh proyecto-platform/ejemplos-invalidos/tamanio-no-permitido.yaml
apiVersion: score.dev/v1b1
metadata:
  name: lista-tareas
  owner: squad-tareas
containers:
  web:
    image: .
    variables:
      DB_HOST: ${resources.db.host}
      DB_PORT: ${resources.db.port}
      DB_NAME: ${resources.db.name}
      DB_USER: ${resources.db.username}
      DB_PASSWORD: ${resources.db.password}
service:
  ports:
    www:
      port: 8080
resources:
  db:
    type: postgres
    params:
      size: postgres-xl
