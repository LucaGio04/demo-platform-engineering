# GitHub Actions solo ejecuta workflows en /.github/workflows/ de la raiz
# del repositorio. Este archivo vive aca para compararlo en la demo.
# Para usarlo de verdad, movelo a esa carpeta. Las rutas no cambian:
# el contexto de build es la raiz del repo.
name: pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Codigo
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Dependencias
        working-directory: app
        run: npm ci

      - name: Tests
        working-directory: app
        run: npm test

  imagen:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Codigo
        uses: actions/checkout@v4

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nombre en minusculas
        id: imagen
        run: echo "nombre=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: proyecto-devops/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.imagen.outputs.nombre }}:${{ github.sha }}
